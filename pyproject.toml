[project]
name = "glab-cli-extras"
version = "0.9.1"
description = "Extra commands for the GitLab CLI (glab): glab-watch reports changes to merge requests, pipelines and branches, glab-pipeline inspects a pipeline, glab-discussion reads and writes merge request discussions, and glab-search-code downloads every file a GitLab code search matched."
readme = "README.md"
license = "MIT"
authors = [{ name = "Filip Procházka", email = "dev@fprochazka.cz" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = [
  "bash-classify>=0.14,<0.15",
  "cc-blackbox>=0.5.1,<0.6",
  "rich>=14",
  "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/fprochazka/glab-cli-extras"
Repository = "https://github.com/fprochazka/glab-cli-extras"
Issues = "https://github.com/fprochazka/glab-cli-extras/issues"

[project.scripts]
glab-watch = "glab_cli_extras.cli.watch:main"
glab-pipeline = "glab_cli_extras.cli.pipeline:main"
glab-discussion = "glab_cli_extras.cli.discussion:main"
glab-mr-status = "glab_cli_extras.cli.mr_status:main"
glab-search-code = "glab_cli_extras.cli.search_code:main"
glab-cli-extras-cc-hook = "glab_cli_extras.cc_hook.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glab_cli_extras"]

[tool.uv]
package = true

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "typecheck" },
  { include-group = "test" },
]
lint = ["ruff>=0.11"]
typecheck = ["mypy>=1.15"]
test = ["pytest>=8"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Tests ported from glab-pipeline and glab-discussion as they were, without type annotations.
module = [
  "pipeline_fixtures",
  "test_pipeline_inspect_artefacts",
  "test_pipeline_inspect_decisions",
  "test_pipeline_inspect_summary",
  "test_pipeline_models",
  "test_pipeline_summary_dict",
  "test_discussion_cli",
  "test_discussion_delete",
  "test_discussion_diff",
  "test_discussion_drafts",
  "test_discussion_edit",
  "test_discussion_write",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
