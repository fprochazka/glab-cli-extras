[project]
name = "glab-cli-extras"
version = "0.1.0"
description = "Extra commands for the GitLab CLI (glab): glab-watch reports changes to merge requests, pipelines and branches."
readme = "README.md"
license = "MIT"
authors = [{ name = "Filip Procházka", email = "dev@fprochazka.cz" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = [
  "cc-blackbox>=0.2",
  "rich>=14",
  "typer>=0.15",
]

[project.scripts]
glab-watch = "glab_cli_extras.cli.watch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glab_cli_extras"]

[tool.uv]
package = true

# Local development against a sibling checkout of the SDK, which is not published yet.
[tool.uv.sources]
cc-blackbox = { path = "../cc-blackbox", editable = true }

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "typecheck" },
  { include-group = "test" },
]
lint = ["ruff>=0.11"]
typecheck = ["mypy>=1.15"]
test = ["pytest>=8"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
